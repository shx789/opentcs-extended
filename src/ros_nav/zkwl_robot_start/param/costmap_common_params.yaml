max_obstacle_height: 2.0  # assume something like an arm is mounted on top of the robot

# Obstacle Cost Shaping (http://wiki.ros.org/costmap_2d/hydro/inflation)
#robot_radius: 0.25  # distance a circular robot should be clear of the obstacle (kobuki: 0.18)
#footprint: [[x0, y0], [x1, y1], ... [xn, yn]]  # if the robot is not circular
#footprint: [[0.33,-0.23],[0.33,0.23],[-0.41,0.23],[-0.41,-0.23]]
#footprint: [[0.53,-0.35],[0.53,0.35],[-0.53,0.35],[-0.53,-0.35]]
#footprint: [[0.50,-0.30],[0.5,0.30],[-0.5,0.30],[-0.5,-0.30]]
#footprint: [[0.63,-0.34],[0.63,0.34],[-0.15,0.34],[-0.15,-0.34]]
#footprint: [[0.25,-0.21],[0.25,0.21],[-0.27,0.21],[-0.27,-0.21]]  #dt01
footprint: [[0.48,-0.31],[0.48,0.31],[-0.51,0.31],[-0.51,-0.31]]   #

#map_type: voxel

obstacle_layer:
  enabled:              true
  max_obstacle_height:  2.0
  min_obstacle_height:  0.0
  #origin_z:             0.0
  #z_resolution:         0.2
  z_voxels:              20
  #unknown_threshold:    15
  #mark_threshold:       0
  combination_method:   1
  track_unknown_space:  true    #true needed for disabling global path planning through unknown space
  obstacle_range: 2.5 #2.0
  raytrace_range: 3 #5.0
  #origin_z: 0.0
  #z_resolution: 0.2
  #z_voxels: 2
  publish_voxel_map: false
  observation_sources:  scan scan1 scan_16 virtual_wall
  scan:
    data_type: LaserScan
    topic: "/scan"
    marking: true
    clearing: true
    inf_is_valid: true
    expected_update_rate: 0
    min_obstacle_height: 0.0
    max_obstacle_height: 1.0

  scan1:
    data_type: LaserScan
    topic: "/scan1"
    marking: true
    clearing: true
    inf_is_valid: true
    expected_update_rate: 0
    min_obstacle_height: 0.0
    max_obstacle_height: 1.0

  scan_16:
    data_type: LaserScan
    topic: "/scan_16"
    marking: true
    clearing: true
    inf_is_valid: true
    expected_update_rate: 0
    min_obstacle_height: -2.0
    max_obstacle_height: 2.0

  
  #add zxp
  virtual_wall: 
    data_type: PointCloud2
    topic: /virtual_wall_cloud
    marking: true 
    clearing: true
    obstacle_range: 100000
    raytrace_range: 100000


#cost_scaling_factor and inflation_radius were now moved to the inflation_layer ns
inflation_layer:
  enabled:              true
  cost_scaling_factor:  10  #5 #10.0  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     0.4     #0.50  # max. distance from an obstacle at which costs are incurred for planning paths.

static_layer:
  enabled:              true
  map_topic:            "/map"



