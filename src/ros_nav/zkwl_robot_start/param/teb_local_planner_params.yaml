TebLocalPlannerROS:

 odom_topic: odom
    
 # Trajectory
  
 teb_autosize: True
 dt_ref: 0.3
 dt_hysteresis: 0.03
 max_samples: 500
 global_plan_overwrite_orientation: True
 allow_init_with_backwards_motion: False
 max_global_plan_lookahead_dist: 1.5 #3  #指定考虑优化的全局计划子集的最大长度
 global_plan_viapoint_sep: 0.4 #-1 
 global_plan_prune_distance: 1
 exact_arc_length: False
 feasibility_check_no_poses: 50
 publish_feedback: False
    
 # Robot
 #transform_tolerance :0.5
         
 max_vel_x: 0.5
 max_vel_x_backwards: 0.11
 max_vel_y: 0.0
 max_vel_theta: 0.5 #0.3
 acc_lim_x: 0.11
 acc_lim_theta: 0.11 #0.3 #0.11
 min_turning_radius: 0.0 # diff-drive robot (can turn on place!)
#是否允许原地转
 cmd_angle_instead_rotvel: False  # cmd_angle_instead_rotvel(bool,defaule:false) 是否允许原地转
 wheelbase: 0.0 #wheelbase (double, default: 1.0)  diff-drive: 0.0

 footprint_model:
   #type: "point"
   type: "polygon"
#   vertices: [[0.63,-0.34],[0.63,0.34],[-0.15,0.34],[-0.15,-0.34]]
#   vertices: [[0.33,-0.23],[0.33,0.23],[-0.41,0.23],[-0.41,-0.23]]
#   vertices: [[0.50,-0.30],[0.5,0.30],[-0.5,0.30],[-0.5,-0.30]]
#   vertices: [[0.25,-0.21],[0.25,0.21],[-0.27,0.21],[-0.27,-0.21]] #dt01
   vertices: [[0.48,-0.31],[0.48,0.31],[-0.51,0.31],[-0.51,-0.31]]

 # GoalTolerance
    
 xy_goal_tolerance: 0.2 #0.05 #0.2
 yaw_goal_tolerance: 0.1 #0.2 #0.10 #0.1
 free_goal_vel: False
 complete_global_plan: True
    
 # Obstacles
    
 min_obstacle_dist: 0.1 #0.2 # This value must also include our robot radius, since footprint_model is set to "point".
 inflation_dist: 0.1
 include_costmap_obstacles: True
 costmap_obstacles_behind_robot_dist: 1.5
 obstacle_poses_affected: 15

 dynamic_obstacle_inflation_dist: 0.6
 include_dynamic_obstacles: True

 costmap_converter_plugin: ""
 costmap_converter_spin_thread: True
 costmap_converter_rate: 5

 # Optimization
    
 no_inner_iterations: 5
 no_outer_iterations: 4
 optimization_activate: True
 optimization_verbose: False
 penalty_epsilon:  0.1
 obstacle_cost_exponent: 4
 weight_max_vel_x: 2
 weight_max_vel_theta: 1
 weight_acc_lim_x: 20
 weight_acc_lim_theta: 5
 weight_kinematics_nh: 1000
 weight_kinematics_forward_drive: 1000 #100
 weight_kinematics_turning_radius: 1
 weight_optimaltime: 5 #2 #0.5 #2 # must be > 0
 weight_shortest_path: 0
 weight_obstacle: 50 #100
 weight_inflation: 5 #2 #0.2
 weight_dynamic_obstacle: 10
 weight_dynamic_obstacle_inflation: 0.2
 weight_viapoint: 1000 #1
 weight_adapt_factor: 2

 # Homotopy Class Planner

 enable_homotopy_class_planning: True #激活并行规划（因为一次优化多个轨迹，占用更多的CPU资源
 enable_multithreading: True  #激活多个线程，以便在不同的线程中规划每个轨迹
 max_number_classes: 1 #4  #考虑到的不同轨迹的最大数量b
 max_number_plans_in_current_class: 1 #不同轨迹5
 selection_cost_hysteresis: 1.0
 selection_prefer_initial_plan: 0.9
 selection_obst_cost_scale: 100.0
 selection_alternative_time_cost: False
 
 roadmap_graph_no_samples: 15
 roadmap_graph_area_width: 5
 roadmap_graph_area_length_scale: 1.0
 h_signature_prescaler: 0.5
 h_signature_threshold: 0.1
 obstacle_heading_threshold: 0.45
 switching_blocking_period: 0.0
 viapoints_all_candidates: True
 delete_detours_backwards: True
 max_ratio_detours_duration_best_duration: 3.0
 visualize_hc_graph: False
 visualize_with_time_as_z_axis_scale: False

# Recovery
 
 shrink_horizon_backup: True
 shrink_horizon_min_duration: 10
 oscillation_recovery: True
 oscillation_v_eps: 0.1
 oscillation_omega_eps: 0.1
 oscillation_recovery_min_duration: 10
 oscillation_filter_duration: 10
